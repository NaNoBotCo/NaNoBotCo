<svg viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="NaN — คุณแนน. An explorer at the seam of the digital and the ancient.">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141019"/>
      <stop offset="100%" stop-color="#0a080d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#d81f2c" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#d81f2c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d81f2c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#caa04a"/>
      <stop offset="50%" stop-color="#e7c66c"/>
      <stop offset="100%" stop-color="#caa04a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="280" fill="url(#ink)"/>
  <rect x="0" y="0" width="1200" height="280" fill="url(#glow)"/>

  <!-- hairline niche frame -->
  <rect x="14" y="14" width="1172" height="252" fill="none" stroke="#e7c66c" stroke-opacity="0.25" stroke-width="1"/>

  <!-- left unalome -->
  <g stroke="#e7c66c" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round">
    <path d="M 70 200 C 95 200 95 175 70 175 C 45 175 45 150 70 150 C 100 150 100 120 60 120"/>
    <circle cx="60" cy="112" r="4" fill="#e7c66c" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- right unalome (mirrored) -->
  <g stroke="#e7c66c" stroke-opacity="0.55" stroke-width="1.6" fill="none" stroke-linecap="round" transform="translate(1200,0) scale(-1,1)">
    <path d="M 70 200 C 95 200 95 175 70 175 C 45 175 45 150 70 150 C 100 150 100 120 60 120"/>
    <circle cx="60" cy="112" r="4" fill="#e7c66c" fill-opacity="0.7" stroke="none"/>
  </g>

  <!-- wordmark -->
  <text x="600" y="130" text-anchor="middle" font-family="Georgia, 'Noto Serif', serif" font-size="64" letter-spacing="10" fill="url(#gold)">NaN</text>
  <text x="600" y="164" text-anchor="middle" font-family="'Noto Sans Thai', Georgia, serif" font-size="20" fill="#e7c66c" fill-opacity="0.85">คุณแนน · wichaa practitioner</text>

  <!-- tagline -->
  <text x="600" y="204" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="17" fill="#cfc7d6" fill-opacity="0.8">An explorer at the seam of the digital and the ancient.</text>

  <!-- 1729 in binary, one dot per bit (11011000001), echoing the takhaap motif -->
  <g transform="translate(600,238)">
    <text x="0" y="-14" text-anchor="middle" font-family="monospace" font-size="10" fill="#e7c66c" fill-opacity="0.45">1729 — 0b11011000001</text>
    <g>
      <circle cx="-100" cy="0" r="4" fill="#e7c66c" fill-opacity="0.9"/>
      <circle cx="-80"  cy="0" r="4" fill="#e7c66c" fill-opacity="0.9"/>
      <circle cx="-60"  cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="-40"  cy="0" r="4" fill="#e7c66c" fill-opacity="0.9"/>
      <circle cx="-20"  cy="0" r="4" fill="#e7c66c" fill-opacity="0.9"/>
      <circle cx="0"    cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="20"   cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="40"   cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="60"   cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="80"   cy="0" r="4" fill="#e7c66c" fill-opacity="0.15"/>
      <circle cx="100"  cy="0" r="4" fill="#e7c66c" fill-opacity="0.9"/>
    </g>
  </g>
</svg>
